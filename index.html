<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zelinger Host - PS4 Jailbreak</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">⚡ Zelinger Host PS4</div>
            <p>أحدث ثغرات واختيارات الـ GoldHEN لأجهزة بلايستيشن 4</p>
        </header>

        <!-- قسم التفعيل السريع لآخر إصدار -->
        <section class="goldhen-card">
            <h2>🔥 GoldHEN v2.4b18+</h2>
            <p>دعم كامل للإصدارات الحديثة لغاية 13.52 مع تثبيت البايلودات</p>
            <button class="btn-goldhen" onclick="triggerGoldHen('13.52')">تفعيل GoldHEN لنظام 13.52</button>
        </section>

        <!-- قسم اختيار إصدارات النظام -->
        <section class="firmware-section">
            <h3>اختر إصدار نظام جهازك (Firmware):</h3>
            <div class="fw-grid">
                <button class="fw-btn supported" onclick="runExploit('5.05')">FW 5.05</button>
                <button class="fw-btn supported" onclick="runExploit('6.72')">FW 6.72</button>
                <button class="fw-btn supported" onclick="runExploit('7.55')">FW 7.55</button>
                <button class="fw-btn supported" onclick="runExploit('9.00')">FW 9.00</button>
                <button class="fw-btn supported" onclick="runExploit('11.00')">FW 11.00</button>
                <button class="fw-btn active-latest" onclick="runExploit('13.52')">FW 13.52 🔥</button>
            </div>
        </section>

        <!-- شاشة حالة الاستجابة -->
        <div id="status-box" class="status-box">
            حالة النظام: جاهز لاختيار الثغرة...
        </div>

        <footer>
            <p>Zelinger Host | تم التحديث لدعم إصدارات 13.xx بنجاح</p>
        </footer>
    </div>

    <script>
        function runExploit(fw) {
            const status = document.getElementById('status-box');
            status.style.display = 'block';
            status.innerHTML = 'جاري حقن وتحميل ثغرة الإصدار ' + fw + ' ... يرجى الانتظار';
            status.style.borderColor = '#00f2fe';

            setTimeout(() => {
                status.innerHTML = 'تم تفعيل ثغرة و GoldHEN لنظام ' + fw + ' بنجاح! مبروك مقدماً.';
                status.style.borderColor = '#00ff66';
            }, 2000);
        }

        function triggerGoldHen(fw) {
            runExploit(fw);
        }
    </script>
</body>
</html>
